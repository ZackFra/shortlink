<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${title}</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    font-family: ui-sans-serif, system-ui, sans-serif;
    background: #f6f3ee;
    color: #1c1917;
  }
  main {
    width: min(26rem, 100%);
    padding: 1.75rem 1.5rem 1.5rem;
    background: #fff;
    border: 1px solid #e7e5e4;
    border-radius: 1rem;
    box-shadow: 0 16px 40px rgb(28 25 23 / 6%);
  }
  .mark {
    margin: 0 0 1.25rem;
    font-size: .7rem;
    font-weight: 650;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: #a8a29e;
  }
  h1 {
    margin: 0;
    font-size: 1.6rem;
    line-height: 1.2;
    font-weight: 620;
    letter-spacing: -.02em;
  }
  p {
    margin: .7rem 0 0;
    line-height: 1.5;
    color: #57534e;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1c1917; color: #fafaf9; }
    main { background: #292524; border-color: #44403c; box-shadow: none; }
    .mark { color: #a8a29e; }
    p { color: #d6d3d1; }
  }
</style>
</head>
<body>
<main>
<p class="mark">shortlink</p>
<h1>${title}</h1>
<p>${message}</p>
</main>
</body>
</html>
